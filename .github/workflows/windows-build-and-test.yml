name: Windows build and Release test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows Debug and Release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore ReelForge.sln --verbosity minimal

      - name: Build solution (Debug)
        run: dotnet build ReelForge.sln --configuration Debug --no-restore --verbosity minimal

      - name: Build solution (Release)
        run: dotnet build ReelForge.sln --configuration Release --no-restore --verbosity minimal

      - name: Test solution
        run: dotnet test ReelForge.sln --configuration Release --no-build --verbosity normal
