name: Windows build and Release test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows Debug and Release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore ReelForge.sln --verbosity minimal

      - name: Build solution (Debug)
        run: dotnet build ReelForge.sln --configuration Debug --no-restore --verbosity minimal

      - name: Build solution (Release)
        run: dotnet build ReelForge.sln --configuration Release --no-restore --verbosity minimal

      - name: Test portable suite
        run: dotnet test tests/ReelForge.Tests/ReelForge.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Test Windows platform suite
        run: dotnet test tests/ReelForge.Platform.Windows.Tests/ReelForge.Platform.Windows.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Test WPF App suite
        run: dotnet test tests/ReelForge.App.Tests/ReelForge.App.Tests.csproj --configuration Release --no-restore --verbosity normal
