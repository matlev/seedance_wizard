<!doctype html><meta charset="utf-8"><title>ReelForge G0.4 native playback harness</title>
<button id="start" type="button" disabled>Preparing native playback checks…</button><div id="media" hidden></div><pre id="result" aria-live="polite">Loading the approved four-route corpus.</pre>
<script>
/* Manual proof harness: browser-native HTMLMediaElement only. Its results are technical evidence, not an audible/perceptual-sync or delivery-capability conclusion. */
const result=document.querySelector('#result'), start=document.querySelector('#start'), media=document.querySelector('#media'); const wait=(ms)=>new Promise(r=>setTimeout(r,ms)); const once=(m,n,ms=6000)=>new Promise((resolve,reject)=>{let t=setTimeout(()=>reject(new Error('Timed out waiting for '+n)),ms);m.addEventListener(n,()=>{clearTimeout(t);resolve()}, {once:true})}); let prepared=[];
let blocked=[];
fetch('manifest.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(new Error('Manifest request failed: '+r.status))).then(manifest=>{if(manifest.schemaVersion!==2||!Array.isArray(manifest.routes)||!Array.isArray(manifest.blockedRoutes)||manifest.routes.length+manifest.blockedRoutes.length!==4)throw Error('Manifest does not expose four route dispositions');blocked=manifest.blockedRoutes.map(route=>({id:route.id,status:route.status,reason:route.reason,transformation:route.transformation}));prepared=manifest.routes.map(route=>{const video=document.createElement('video'),events=[],state={ended:0};video.preload='auto';video.muted=true;video.playsInline=true;['loadedmetadata','canplay','error','play','pause','seeking','seeked','ended'].forEach(n=>video.addEventListener(n,()=>{events.push({name:n,time:performance.now(),currentTime:video.currentTime});if(n==='ended')state.ended++}));video.src=route.url;media.append(video);return {route,video,events,state};});start.disabled=false;start.textContent='Start native playback checks';result.textContent='Awaiting an explicit user click.';}).catch(error=>{result.textContent='Harness preparation failed: '+error;});
async function routeCheck(route,v,events,state,initialPlay){if(v.readyState<1)await once(v,'loadedmetadata');if(v.readyState<3)await once(v,'canplay');let metadata={width:v.videoWidth,height:v.videoHeight,duration:v.duration};let canPlayType=v.canPlayType(route.mime);if(initialPlay)await initialPlay;else await v.play();await wait(450);let first=v.currentTime;if(!(first>0))throw Error('Media clock did not advance');v.pause();let paused=v.currentTime;await wait(160);let stable=Math.abs(v.currentTime-paused)<=0.08;if(!stable)throw Error('Media clock was not stable while paused');let midpointPromise=once(v,'seeked');v.currentTime=Math.min(Math.max(v.duration/2,.05),Math.max(v.duration-.25,.05));await midpointPromise;let midpoint=v.currentTime;if(Math.abs(midpoint-v.duration/2)>0.20)throw Error('Midpoint seek outside tolerance');await v.play();await wait(300);let resumed=v.currentTime;if(!(resumed>midpoint))throw Error('Media clock did not resume');let endedPromise=once(v,'ended');v.currentTime=Math.max(0,v.duration-.20);await endedPromise;if(state.ended!==1)throw Error('Ended must fire exactly once');v.currentTime=0;await v.play();await wait(250);let replay=v.currentTime;if(!(replay>0))throw Error('Replay did not advance');v.pause();return {id:route.id,mime:route.mime,videoOnly:route.videoOnly,userAgent:navigator.userAgent,platform:navigator.platform,canPlayType,metadata,firstAdvance:first,pauseStable:stable,midpointSeek:midpoint,resumeAdvance:resumed,replayAdvance:replay,endedCount:state.ended,events};}
start.addEventListener('click',async()=>{start.disabled=true;const firstPlay=prepared.length?prepared[0].video.play():Promise.resolve();let highEntropyIdentity='unavailable: navigator.userAgentData.getHighEntropyValues is not exposed';try{if(navigator.userAgentData?.getHighEntropyValues)highEntropyIdentity=JSON.stringify(await navigator.userAgentData.getHighEntropyValues(['architecture','bitness','fullVersionList','model','platformVersion','wow64']))}catch(e){highEntropyIdentity='unavailable: '+String(e)}let report={schemaVersion:2,kind:'ReelForge Gate 0 independent-playback manual native HTMLMediaElement observation',startedAt:new Date().toISOString(),userAgent:navigator.userAgent,platform:navigator.platform,highEntropyIdentity,routes:[...blocked],limitations:'No audible/perceptual sync conclusion; one native media clock is observed for paired A/V. Blocked routes are inherited source dispositions and are not attempted.',status:'failed'};try{for(let i=0;i<prepared.length;i++){let {route,video,events,state}=prepared[i];try{report.routes.push({status:'passed',...(await routeCheck(route,video,events,state,i===0?firstPlay:null))})}catch(e){report.routes.push({id:route.id,status:'failed',error:String(e)})}}report.status=report.routes.some(r=>r.status==='failed')?'failed':report.routes.some(r=>r.status==='blocked')?'completed-with-inherited-blocked-routes':'passed'}catch(e){report.status='failed';report.error=String(e)}try{let saved=await fetch('results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});report.localResultReceipt=saved.ok?await saved.json():{status:'not-saved',httpStatus:saved.status}}catch(e){report.localResultReceipt={status:'not-saved',error:String(e)}}result.textContent=JSON.stringify(report,null,2);start.disabled=false;});
</script>
